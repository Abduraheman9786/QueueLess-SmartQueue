<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QueueLess — Smart Waiting System</title><style>
:root{--bg:#0e1626;--panel:#17243b;--text:#eef4ff;--muted:#a6b8d7;--border:#2a3d60;--accent:#2dd4bf;--red:#fb7185;--yellow:#fbbf24;--green:#4ade80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}button.primary,.active{background:var(--accent);color:#052a27;font-weight:700}button.danger{color:var(--red)}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:#17233a;border-bottom:1px solid var(--border);position:sticky;top:0}nav{display:flex;gap:7px;padding:10px 14px;background:#17233a;border-bottom:1px solid var(--border);overflow:auto}.logo{font-size:1.4rem;font-weight:900;color:var(--accent)}.muted{color:var(--muted)}.spacer{flex:1}main{max-width:1150px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:13px}.card,.stat{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px}.card h3{margin:0 0 6px}.tag{display:inline-block;background:#123d3b;color:var(--accent);border-radius:20px;padding:3px 9px;font-size:.8rem;font-weight:800}.closed{background:#422232;color:var(--red)}.waiting{background:#493a18;color:var(--yellow)}.done{background:#173d2b;color:var(--green)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}.stat b{display:block;font-size:1.8rem}label{display:block;color:var(--muted);margin:10px 0 4px;font-size:.9rem}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#0e192b;color:var(--text)}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.big{font-size:2.3rem;font-weight:900;color:var(--accent)}.small{font-size:.86rem}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border)}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:20px}.error{background:#492332;color:#ffd2dc;padding:10px;border-radius:9px;margin-top:10px}.notice{background:#123d3b;color:#b8fff4;padding:10px;border-radius:9px;margin:10px 0}.token{border:1px dashed var(--accent)}footer{text-align:center;color:var(--muted);padding:20px;font-size:.82rem}@media(max-width:600px){main{padding:12px}header{padding:11px}}
</style></head><body><header><span class="logo">QueueLess</span><span class="muted">Smart Waiting System</span><span class="spacer"></span><span id="mode" class="muted">Customer mode</span><button id="adminBtn">Admin login</button><button id="fontBtn">A+</button></header><nav id="nav"></nav><main id="app"></main><footer>QueueLess · Keep your place in line, without waiting in line.</footer><div id="modal"></div>
<script>
(()=>{const ADMIN_USER='admin2026',ADMIN_PASS='Qless#26',KEY='queueless-single-v1';const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed=[{id:'hospital',place:'City Hospital',name:'General OPD',desc:'Doctor consultation',avg:10,fee:null,sundayClosed:true,governmentService:false,openT:'00:00',closeT:'23:59',limit:100,counters:['Counter 1','Counter 2'],open:true,paused:false,notice:''},{id:'salon',place:'Glow Salon',name:'Haircut & Styling',desc:'Haircut, shave and styling',avg:20,fee:null,sundayClosed:true,governmentService:false,openT:'00:00',closeT:'23:59',limit:40,counters:['Stylist 1','Stylist 2'],open:true,paused:false,notice:''},{id:'office',place:'Tahsil Office',name:'Document Verification',desc:'Certificates and document verification',avg:15,fee:null,sundayClosed:true,governmentService:true,openT:'00:00',closeT:'23:59',limit:80,counters:['Window 1','Window 2'],open:true,paused:false,notice:''}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.services)||!Array.isArray(data.tokens))data={services:seed,tokens:[],logs:[]};data.services.forEach(s=>{if(s.fee===0)s.fee=null;if(s.sundayClosed==null)s.sundayClosed=true;if(s.governmentService==null)s.governmentService=(s.id==='office');if(!Array.isArray(s.counters))s.counters=['Counter 1'];});let admin=false,view='book',customer=localStorage.getItem('ql-name')||'';const services=()=>data.services,allToday=()=>data.tokens.filter(t=>t.date===today()),queue=sid=>allToday().filter(t=>t.sid===sid),waiting=sid=>queue(sid).filter(t=>t.status==='Waiting').sort((a,b)=>a.num-b.num),active=sid=>queue(sid).filter(t=>['Called','In Service'].includes(t.status)),counts=sid=>{let a=queue(sid);return{generated:a.length,cancelled:a.filter(t=>t.status==='Cancelled').length,waiting:a.filter(t=>t.status==='Waiting').length,completed:a.filter(t=>t.status==='Completed').length,active:a.filter(t=>['Called','In Service'].includes(t.status)).length}},openReason=s=>{if(!s.open)return'Service unavailable';if(s.paused)return'Queue paused';const day=new Date().getDay();if(s.governmentService&&(day===0||day===6))return day===6?'Government service closed on Saturdays':'Government service closed on Sundays';if(s.sundayClosed&&day===0)return'Closed on Sundays';let n=new Date(),m=n.getHours()*60+n.getMinutes(),mins=x=>{let p=x.split(':');return +p[0]*60 + +p[1]};if(m<mins(s.openT)||m>=mins(s.closeT))return'Outside service hours';if(counts(s.id).generated-counts(s.id).cancelled>=s.limit)return'Daily token limit reached';return''},label=(s,n)=>(s.name.replace(/[^a-z]/ig,'').slice(0,2).toUpperCase()||'QL')+'-'+String(n).padStart(3,'0'),ahead=t=>waiting(t.sid).filter(x=>x.num<t.num).length+active(t.sid).length,estimate=t=>Math.max(0,ahead(t)*(services().find(s=>s.id===t.sid)?.avg||10)),save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()},toast=m=>{let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style.cssText='position:fixed;bottom:15px;left:15px;right:15px;max-width:550px;margin:auto;background:#2dd4bf;color:#052a27;padding:12px;border-radius:10px;font-weight:bold;z-index:20';document.body.appendChild(x)}x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',3500)};
function login(){if(admin){admin=false;view='book';render();return}document.getElementById('modal').innerHTML=`<div class="modalback" id="back"><form class="modal" id="loginForm"><div class="row"><h2>Admin login</h2><span class="spacer"></span><button type="button" id="close">Close</button></div><p class="muted">Enter administrator credentials to manage queues, counters and reports.</p><label>Username</label><input name="u" autocomplete="username" required><label>Password</label><input name="p" id="pw" type="password" autocomplete="current-password" required><label class="row"><input id="show" type="checkbox" style="width:auto"> Show password</label><div id="err"></div><button class="primary" style="width:100%;margin-top:12px">Login</button></form></div>`;document.getElementById('close').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('back').onclick=e=>{if(e.target.id==='back')document.getElementById('modal').innerHTML=''};document.getElementById('show').onchange=e=>document.getElementById('pw').type=e.target.checked?'text':'password';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('u').trim()===ADMIN_USER&&f.get('p')===ADMIN_PASS){admin=true;view='admin';document.getElementById('modal').innerHTML='';render()}else document.getElementById('err').innerHTML='<div class="error">Incorrect username or password.</div>'}}
function bookView(){return `<h2>Book a token</h2><p class="muted">Choose a service to generate your token and check your estimated visit time.</p><div class="card" style="max-width:520px"><label>Your name</label><input id="customerName" value="${esc(customer)}" placeholder="Enter your name"></div><div class="grid" style="margin-top:14px">${services().map(s=>{let c=counts(s.id),why=openReason(s),w=waiting(s.id).length;return `<div class="card"><div class="muted">${esc(s.place)}</div><h3>${esc(s.name)}</h3><p class="muted">${esc(s.desc)}</p><span class="tag ${why?'closed':''}">${why||'Open for booking'}</span><p class="small muted">${c.generated} generated · ${c.cancelled} cancelled · ${c.waiting} waiting · ${c.completed} completed</p>${s.fee!=null&&s.fee!==''?`<p class="small muted">Service fee: <b>₹${Number(s.fee).toFixed(2)}</b></p>`:`<p class="small muted">No service fee</p>`}<p class="small muted">Average service: ${s.avg} min · Next estimated visit: ${time(Date.now()+(w+active(s.id).length)*s.avg*60000)}</p><p class="small muted">Working days: ${s.governmentService?'Monday–Friday (closed Saturday & Sunday)':(s.sundayClosed?'Monday–Saturday (closed Sunday)':'All days, subject to service hours')}</p>${s.notice?`<div class="notice">${esc(s.notice)}</div>`:''}<label for="counter-${s.id}">Counter</label><select id="counter-${s.id}"><option value="">Any available</option>${s.counters.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><button class="primary" style="margin-top:12px" data-a="book" data-id="${s.id}" ${why?'disabled':''}>Book token</button></div>`}).join('')}</div>`}
function ticket(t){let s=services().find(x=>x.id===t.sid),m=estimate(t);return `<div class="card token"><div class="muted">${esc(s?.place||'')} · ${esc(t.sname)}</div><div class="big">${esc(t.label)}</div><p><span class="tag ${t.status==='Cancelled'?'closed':t.status==='Completed'?'done':t.status==='Waiting'?'waiting':''}">${esc(t.status)}</span> · ${t.date} · booked ${time(t.createdAt)}</p>${t.fee!=null&&t.fee!==''?`<p>Service fee: <b>₹${Number(t.fee).toFixed(2)}</b></p>`:`<p>Service fee: <b>No fee</b></p>`}<div class="row" style="align-items:flex-start;margin:10px 0"><img alt="QR code for ${esc(t.label)}" width="116" height="116" style="background:white;padding:5px;border-radius:8px" src="https://api.qrserver.com/v1/create-qr-code/?size=116x116&data=${encodeURIComponent('QueueLess token '+t.label+' | Service: '+t.sname+' | Date: '+t.date+' | Fee: '+(t.fee!=null?'INR '+Number(t.fee).toFixed(2):'No fee')+' | Status: '+t.status)}"><span class="muted small">Scan this QR code for token details.</span></div>${t.status==='Waiting'?`<p><b>${m} min</b> estimated wait · visit around <b>${time(Date.now()+m*60000)}</b><br><span class="muted">${ahead(t)} people ahead</span></p>`:t.status==='Called'?'<p><b>Your token has been called. Please go to the counter.</b></p>':`<p>${esc(t.status)}.</p>`}${t.status==='Waiting'?`<button class="danger" data-a="cancel" data-id="${t.id}">Cancel token</button>`:''}</div>`}
function mineView(){if(!customer)return'<div class="card"><h2>My tokens</h2><p>Enter your name on Book token to see bookings from this browser.</p></div>';let ts=data.tokens.filter(t=>t.customer.toLowerCase()===customer.toLowerCase()).sort((a,b)=>b.createdAt-a.createdAt);return `<h2>My tokens</h2><p class="muted">Bookings for ${esc(customer)}</p><div class="grid">${ts.map(ticket).join('')||'<div class="card">No tokens found.</div>'}</div>`}
function trackView(){return `<div class="card" style="max-width:600px"><h2>Track token</h2><form id="trackForm"><label>Token number</label><input id="trackNo" placeholder="e.g. GE-001" required><button class="primary" style="margin-top:10px">Find token</button></form><div id="trackResult"></div></div>`}
function displayView(){return `<h2>Public display</h2><div class="grid">${services().map(s=>{let a=active(s.id)[0],w=waiting(s.id).slice(0,3),c=counts(s.id);return `<div class="card" style="text-align:center"><div class="muted">${esc(s.place)}</div><h3>${esc(s.name)}</h3><p class="muted">Now serving</p><div class="big">${esc(a?.label||'—')}</div><p class="muted">${a?'Please go to '+esc(a.counter||'the counter'):'No active token'}</p><p class="muted">Next: ${w.map(t=>esc(t.label)).join(', ')||'—'}</p><p class="muted">${c.waiting} waiting · ${c.completed} completed</p></div>`}).join('')}</div>`}
function adminView(){let ts=allToday(),w=ts.filter(t=>t.status==='Waiting'),a=ts.filter(t=>['Called','In Service'].includes(t.status));return `<h2>Admin dashboard</h2><p class="muted">Manage tokens and services. Customers cannot see these controls.</p><div class="stats">${[['Generated today',ts.length],['Cancelled',ts.filter(t=>t.status==='Cancelled').length],['Waiting',w.length],['Called / serving',a.length],['Completed',ts.filter(t=>t.status==='Completed').length],['Skipped',ts.filter(t=>t.status==='Skipped').length]].map(([k,v])=>`<div class="stat"><b>${v}</b>${k}</div>`).join('')}</div><div class="grid">${services().map(s=>{let c=counts(s.id),why=openReason(s);return `<div class="card"><div class="muted">${esc(s.place)}</div><h3>${esc(s.name)}</h3><span class="tag ${why?'closed':''}">${why||'Open'}</span><p class="muted small">${c.generated} generated · ${c.cancelled} cancelled · ${c.waiting} waiting</p><div class="big">${esc(active(s.id)[0]?.label||'—')}</div><p class="muted">Current token</p><div class="row"><button class="primary" data-a="next" data-id="${s.id}">Call Next</button><button data-a="pause" data-id="${s.id}">${s.paused?'Resume':'Pause'} queue</button><button data-a="open" data-id="${s.id}">${s.open?'Close':'Reopen'} service</button><button class="danger" data-a="delete-service" data-id="${s.id}">Delete service</button></div><label>Announcement</label><div class="row"><input id="notice-${s.id}" value="${esc(s.notice)}" placeholder="Service update" style="flex:1;min-width:130px"><button data-a="notice" data-id="${s.id}">Save</button></div><form class="svcform" data-id="${s.id}"><label>Average minutes</label><input name="avg" type="number" min="1" value="${s.avg}" required><label>Open time</label><input name="openT" type="time" value="${s.openT}" required><label>Close time</label><input name="closeT" type="time" value="${s.closeT}" required><label>Daily token limit</label><input name="limit" type="number" min="1" value="${s.limit}" required><label>Service fee (₹, optional)</label><input name="fee" type="number" min="0" step="0.01" value="${s.fee==null?'':s.fee}" placeholder="Leave blank if there is no fee"><label class="row"><input name="sundayClosed" type="checkbox" style="width:auto" ${s.sundayClosed?'checked':''}> Closed on Sundays</label><label class="row"><input name="governmentService" type="checkbox" style="width:auto" ${s.governmentService?'checked':''}> Government service (closed on Saturdays and Sundays)</label><button class="primary" style="margin-top:10px">Save service settings</button></form></div>`}).join('')}</div><section class="card" style="margin-top:18px"><h3>Add a new service</h3><p class="muted small">New services appear on the customer booking page immediately.</p><form id="addService"><div class="formgrid"><div><label>Organization / location</label><input name="place" placeholder="e.g. College Office" required></div><div><label>Service name</label><input name="name" placeholder="e.g. Fee Payment" required></div><div><label>Description</label><input name="desc" placeholder="Service description" required></div><div><label>Average minutes per token</label><input name="avg" type="number" min="1" max="240" value="10" required></div><div><label>Opening time</label><input name="openT" type="time" value="00:00" required></div><div><label>Closing time</label><input name="closeT" type="time" value="23:59" required></div><div><label>Daily token limit</label><input name="limit" type="number" min="1" value="50" required></div><div><label>Service fee (₹, optional)</label><input name="fee" type="number" min="0" step="0.01" placeholder="Leave blank if there is no fee"></div><div><label>Number of counters</label><input name="counterCount" type="number" min="1" max="30" value="1" required></div><div><label>Counter names (comma separated)</label><input name="counters" value="Counter 1, Counter 2" required></div></div><label class="row"><input name="sundayClosed" type="checkbox" style="width:auto" checked> Closed on Sundays</label><label class="row"><input name="governmentService" type="checkbox" style="width:auto"> Government service (closed on Saturdays and Sundays)</label><button class="primary" style="margin-top:12px">+ Add service</button></form></section><h3 style="margin-top:22px">Today's tokens</h3><div class="card tablewrap"><table><tr><th>Token</th><th>Customer</th><th>Service</th><th>Booked</th><th>Estimated visit</th><th>Status</th><th>Actions</th></tr>${ts.slice().sort((x,y)=>x.createdAt-y.createdAt).map(t=>`<tr><td><b>${esc(t.label)}</b></td><td>${esc(t.customer)}</td><td>${esc(t.sname)}</td><td>${time(t.createdAt)}</td><td>${t.status==='Waiting'?time(Date.now()+estimate(t)*60000):t.status==='Called'?'Now':'—'}</td><td>${esc(t.status)}</td><td><div class="row">${t.status==='Called'?`<button data-a="start" data-id="${t.id}">Start</button>`:''}${['Called','In Service'].includes(t.status)?`<button data-a="complete" data-id="${t.id}">Complete</button>`:''}${['Waiting','Called'].includes(t.status)?`<button data-a="skip" data-id="${t.id}">Skip</button>`:''}${!['Completed','Cancelled'].includes(t.status)?`<button class="danger" data-a="cancel-admin" data-id="${t.id}">Cancel</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="7">No tokens generated today.</td></tr>'}</table></div><p class="muted small">Prototype note: data is saved in this browser only. Connect a secure backend/database before public production use.</p>`}
function render(){document.getElementById('mode').textContent=admin?'Administrator':'Customer mode';document.getElementById('adminBtn').textContent=admin?'Logout admin':'Admin login';document.getElementById('nav').innerHTML=(admin?[['admin','Dashboard'],['display','Public display']]:[['book','Book token'],['mine','My tokens'],['track','Track'],['display','Public display']]).map(([v,l])=>`<button class="${view===v?'active':''}" data-v="${v}">${l}</button>`).join('');document.getElementById('app').innerHTML=({book:bookView,mine:mineView,track:trackView,display:displayView,admin:adminView}[view]||bookView)();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
document.getElementById('adminBtn').onclick=login;document.getElementById('fontBtn').onclick=()=>document.body.style.fontSize=document.body.style.fontSize==='18px'?'16px':'18px';document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=b.dataset.id,t=data.tokens.find(x=>x.id===id),s=services().find(x=>x.id===id);if(a==='book'){let name=document.getElementById('customerName')?.value.trim()||customer;if(!name){toast('Enter your name first.');return}customer=name;localStorage.setItem('ql-name',name);s=services().find(x=>x.id===id);let reason=openReason(s);if(reason){if(reason.includes('Saturday'))alert('This government service is closed on Saturdays. Please book on a working day (Monday to Friday).');else if(reason.includes('Sunday'))alert('This service is closed on Sundays. Please choose another available service or book on a different day.');else alert('Booking unavailable: '+reason+'. Please choose an available service/time.');toast('Booking unavailable: '+reason);return}if(data.tokens.some(x=>x.customer.toLowerCase()===name.toLowerCase()&&x.sid===id&&x.date===today()&&['Waiting','Called','In Service'].includes(x.status))){toast('You already have an active token for this service.');return}let num=Math.max(0,...queue(id).map(x=>x.num))+1;t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sid:id,sname:s.name,place:s.place,date:today(),num,label:label(s,num),customer:name,status:'Waiting',createdAt:Date.now(),counter:(document.getElementById('counter-'+id)?.value||s.counters[(num-1)%s.counters.length]||'Counter 1'),fee:(s.fee==null||s.fee==='')?null:Number(s.fee)};data.tokens.push(t);view='mine';save();toast('Token '+t.label+' booked.');return}if(a==='cancel'&&t&&confirm('Cancel this token?')){t.status='Cancelled';t.cancelledAt=Date.now();save();toast('Token cancelled.')}if(a==='next'){t=waiting(id)[0];if(!t){toast('No customers waiting.');return}t.status='Called';t.calledAt=Date.now();save();toast('Called '+t.label)}if(a==='start'&&t){t.status='In Service';t.startedAt=Date.now();save()}if(a==='complete'&&t){t.status='Completed';t.completedAt=Date.now();save()}if(a==='skip'&&t){t.status='Skipped';t.skippedAt=Date.now();save()}if(a==='cancel-admin'&&t){t.status='Cancelled';t.cancelledAt=Date.now();save()}if(a==='delete-service'&&s){if(confirm('Delete '+s.name+' from the customer booking page? Existing token history will be retained.')){data.services=data.services.filter(x=>x.id!==id);save();toast('Service deleted.')}}if(a==='pause'){s.paused=!s.paused;save()}if(a==='open'){s.open=!s.open;save()}if(a==='notice'){s.notice=document.getElementById('notice-'+id).value;save()}});document.addEventListener('submit',e=>{if(e.target.id==='trackForm'){e.preventDefault();let q=document.getElementById('trackNo').value.trim().toUpperCase(),t=data.tokens.find(x=>x.label.toUpperCase()===q);document.getElementById('trackResult').innerHTML=t?ticket(t):'<div class="error">Token not found.</div>'}if(e.target.id==='addService'){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),place=f.get('place').trim();let id='service-'+Date.now().toString(36);data.services.push({id,place,name,desc:f.get('desc').trim(),avg:Math.max(1,+f.get('avg')),fee:(f.get('fee')==null||String(f.get('fee')).trim()==='')?null:Math.max(0,+f.get('fee')),sundayClosed:f.get('sundayClosed')==='on',governmentService:f.get('governmentService')==='on',openT:f.get('openT'),closeT:f.get('closeT'),limit:Math.max(1,+f.get('limit')),counters:(()=>{let cs=f.get('counters').split(',').map(x=>x.trim()).filter(Boolean),n=Math.max(1,Math.min(30,+f.get('counterCount')||cs.length));while(cs.length<n)cs.push('Counter '+(cs.length+1));return cs.slice(0,n)})(),open:true,paused:false,notice:''});save();toast('Service added successfully.')}if(e.target.classList.contains('svcform')){e.preventDefault();let s=services().find(x=>x.id===e.target.dataset.id),f=new FormData(e.target);s.avg=+f.get('avg');s.openT=f.get('openT');s.closeT=f.get('closeT');s.limit=+f.get('limit');s.fee=(f.get('fee')==null||String(f.get('fee')).trim()==='')?null:Math.max(0,+f.get('fee'));s.sundayClosed=f.get('sundayClosed')==='on';s.governmentService=f.get('governmentService')==='on';let cs=f.get('counters').split(',').map(x=>x.trim()).filter(Boolean),n=Math.max(1,Math.min(30,+f.get('counterCount')||cs.length));while(cs.length<n)cs.push('Counter '+(cs.length+1));s.counters=cs.slice(0,n);save();toast('Settings saved')}});render();setInterval(()=>{if(!document.getElementById('modal').innerHTML)render()},30000);
})();</script></body></html>
